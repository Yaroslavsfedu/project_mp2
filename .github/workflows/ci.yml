name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint-free типы + тесты)
    runs-on: ubuntu-latest
    services:
      redis:  # тест общего счётчика rate limit между воркерами пропускался без Redis
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Установка зависимостей
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Компиляция (быстрая проверка синтаксиса)
        run: python -m compileall -q app scripts
      - name: Тесты
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Демо-данные и эталонная разметка
        env:
          PYTHONPATH: .
        run: python -m scripts.generate_samples --out ../samples --force
      - name: Метрики качества (CER/WER/F1)
        env:
          PYTHONPATH: .
        run: python -m scripts.evaluate --quiet
      - name: Проверка окружения
        run: python ../scripts/check_env.py --json > /dev/null

  frontend:
    name: Frontend (типы + сборка)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
