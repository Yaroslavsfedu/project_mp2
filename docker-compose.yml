# IDP Platform — полностью локальный контур (On-Premise).
# Сервисы: frontend (nginx), backend (FastAPI), celery_worker, postgres(pgvector),
# redis, minio, ollama. Ни один сервис не обращается к внешним API.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idp}
      POSTGRES_DB: ${POSTGRES_DB:-idp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-idpminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-idpminio-secret}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Проброс GPU (требуется nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "sleep 10 &&
             ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct} &&
             ollama pull ${EMBEDDING_MODEL:-bge-m3} &&
             echo 'Модели загружены'"
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-idp}:${POSTGRES_PASSWORD:-idp}@postgres:5432/${POSTGRES_DB:-idp}
      STORAGE_BACKEND: minio
      QUEUE_BACKEND: celery
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      MINIO_ENDPOINT: minio:9000
      SEED_DEMO: "false"
      TRUST_PROXY_HEADERS: "true"  # API за nginx: IP клиента из X-Forwarded-For
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  celery_worker:
    build: ./backend
    command: ["celery", "-A", "app.ml_pipeline.celery_worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-idp}:${POSTGRES_PASSWORD:-idp}@postgres:5432/${POSTGRES_DB:-idp}
      STORAGE_BACKEND: minio
      QUEUE_BACKEND: celery
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      MINIO_ENDPOINT: minio:9000
      SEED_DEMO: "false"
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
  appdata:
