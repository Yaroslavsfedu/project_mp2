[pytest]
testpaths = tests
asyncio_mode = auto
# один event loop на всю сессию: aiosqlite-потоки доставляют результаты в живой loop,
# а не в уже закрытый (иначе «Event loop is closed» и гонка в предупреждениях)
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
